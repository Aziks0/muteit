[workspace]
resolver = "3"
members = [
  "crates/alone",
  "crates/audio",
  "crates/autostart",
  "crates/key-t",
  "crates/muteit",
]
default-members = ["crates/muteit"]

[workspace.dependencies]
thiserror = "2.0.16"
minijinja = { version = "2.12.0", default-features = false }

# Same version needed for both.
[workspace.dependencies.windows-core]
version = "0.62.2"
[workspace.dependencies.windows]
version = "0.62.2"

[workspace.dependencies.dioxus]
version = "0.7.2-rc.0.1"
default-features = false
features = [
  "macro",
  "html",
  "signals",
  "hooks",
  "document",
  "asset",
  "launch",
  "desktop",
]

[patch.crates-io]
dioxus = { git = "https://github.com/Aziks0/dioxus.git", tag = "v0.7.2-rc.0.1" }
dioxus-signals = { git = "https://github.com/Aziks0/dioxus.git", tag = "v0.7.2-rc.0.1" }

[profile.release]
codegen-units = 1
lto = true

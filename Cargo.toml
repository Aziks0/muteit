[workspace]
resolver = "3"
members = [
  "crates/alone",
  "crates/audio",
  "crates/autostart",
  "crates/key-t",
  "crates/mpsc",
  "crates/muteit",
]
default-members = ["crates/muteit"]

[workspace.dependencies]
thiserror = "2.0.16"
minijinja = { version = "2.12.0", default-features = false }
futures-util = { version = "0.3.32", default-features = false }
global-hotkey = { version = "0.7.0", default-features = false }

# Same version needed for all the windows crates.
[workspace.dependencies.windows-core]
version = "0.100.0"
[workspace.dependencies.windows-bindgen]
version = "0.100.0"

[workspace.dependencies.iced]
version = "0.14.0-rc.0.1"
default-features = false
features = ["wgpu", "tiny-skia", "tokio"]

[workspace.lints.clippy]
# We prefer "module inception" over putting everything in `mod.rs`.
module_inception = "allow"

[patch.crates-io]
iced = { git = "https://github.com/Aziks0/iced.git", tag = "v0.14.0-rc.0.1" }

[profile.release]
codegen-units = 1
lto = true

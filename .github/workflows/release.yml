name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_INCREMENTAL: 0

jobs:
  build-release:
    name: "Build and release"
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          # `windows-bingen` needs it. No way to override it.
          components: rustfmt
      - name: Install Bun
        # v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup envs
        run: >
          bun run .github/scripts/get_envs.ts
          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f
      - name: Install cargo-about
        run: cargo binstall cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Run bundle script
        run: bun run scripts/bundle.ts
      - name: Create release
        if: ${{ !env.ACT }}
        # v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          make_latest: true
          fail_on_unmatched_files: true
          preserve_order: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/LICENSES.md
          token: ${{ secrets.GITHUB_TOKEN }}

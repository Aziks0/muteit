name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

cache-mode: none

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: "Build and release"
    permissions:
      # Needed to create a release.
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        # `windows-bingen` needs `rustfmt`. No way to override it.
        run: >
          rustup toolchain install
          --profile minimal
          --no-self-update
          --component rustfmt
          --target x86_64-pc-windows-msvc
          stable
      - name: Install Bun
        # v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Setup envs
        run: >
          bun run .github/scripts/get_envs.ts
          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f
      - name: Install cargo-about
        run: cargo binstall "cargo-about@$Env:CARGO_ABOUT_VERSION"
        env:
          CARGO_ABOUT_VERSION: ${{ env.CARGO_ABOUT_VERSION }}
      - name: Run bundle script
        run: bun run scripts/bundle.ts
      - name: Create release
        if: ${{ !env.ACT }}
        run: >
          gh release create
          --verify-tag
          --draft
          --title $Env:REF_NAME
          $Env:REF_NAME
          dist/*.exe
          dist/*.zip
          dist/LICENSES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}

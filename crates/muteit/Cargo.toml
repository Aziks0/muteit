[package]
name = "muteit"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
alone = { path = "../alone" }
audio = { path = "../audio" }
autostart = { path = "../autostart" }
key-t = { path = "../key-t" }
mpsc = { path = "../mpsc/" }

iced = { workspace = true }
windows = { workspace = true, features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Threading",
] }
global-hotkey = { workspace = true, features = ["serde"] }

anyhow = "1.0.104"
serde = "1.0.219"
toml = "0.9.5"
tray-icon = "0.24.2"

[features]
default = ["dev"]
dev = ["iced/debug", "iced/hot"]

[build-dependencies]
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "ico",
] }
toml = { version = "0.9.5", default-features = false, features = [
  "std",
  "serde",
  "parse",
  "display",
] }
winresource = { version = "0.1.29", default-features = false }

minijinja = { workspace = true }

[package]
name = "muteit"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
dioxus-signals = { version = "0.7.0-rc.0", features = ["serialize"] }
global-hotkey = { version = "0.7.0", features = ["serde"] }
serde = "1.0.219"
toml = "0.9.5"

dioxus = { workspace = true }

audio = { path = "../audio" }
key-t = { path = "../key-t" }

[build-dependencies]
oxc = { version = "0.92.0", default-features = false, features = [
  "codegen",
  "mangler",
  "minifier",
] }

[package]
name = "muteit"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
alone = { path = "../alone" }
audio = { path = "../audio" }
autostart = { path = "../autostart" }
key-t = { path = "../key-t" }
mpsc = { path = "../mpsc/" }

dioxus = { workspace = true }
windows = { workspace = true, features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Threading",
] }

dioxus-signals = { version = "0.7.2-rc.0.1", features = ["serialize"] }
global-hotkey = { version = "0.7.0", features = ["serde"] }
serde = "1.0.219"
toml = "0.9.5"
tokio = { version = "1.48.0", features = ["sync"] }
futures-util = { version = "0.3.32", default-features = false }

[features]
bundle = []

[build-dependencies]
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "ico",
] }
lightningcss = "1.0.0-alpha.67"
oxc = { version = "0.92.0", default-features = false, features = [
  "codegen",
  "mangler",
  "minifier",
] }
toml = { version = "0.9.5", default-features = false, features = [
  "std",
  "serde",
  "parse",
  "display",
] }
winresource = { version = "0.1.29", default-features = false }

minijinja = { workspace = true }

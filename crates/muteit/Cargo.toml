[package]
name = "muteit"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
alone = { path = "../alone" }
audio = { path = "../audio" }
autostart = { path = "../autostart" }
dark = { path = "../dark" }
hotkey = { path = "../hotkey" }
key-t = { path = "../key-t" }
mpsc = { path = "../mpsc/" }

iced = { workspace = true }
windows-core = { workspace = true }
serde = { workspace = true }

anyhow = "1.0.104"
toml = "0.9.5"
tray-icon = "0.24.2"
smol_str = { version = "0.2", features = ["serde"] }

[features]
default = ["dev"]
dev = ["iced/debug", "iced/hot"]

[build-dependencies]
minijinja = { workspace = true }
windows-bindgen = { workspace = true }

image = { version = "0.25.9", default-features = false, features = [
  "png",
  "ico",
] }
toml = { version = "0.9.5", default-features = false, features = [
  "std",
  "serde",
  "parse",
  "display",
] }
winresource = { version = "0.1.29", default-features = false }

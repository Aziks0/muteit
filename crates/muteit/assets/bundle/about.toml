accepted = [
  "CC0-1.0",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-or-later",
]
targets = ["x86_64-pc-windows-msvc"]
private = { ignore = true }

# `moxcms` and `pxfm` (same author) contain a header with the BSD license and a
# date in every of their files. This makes cargo-about report a different
# license for each individual date, but the reported license "files" also
# contain rust code for some reason. With the clarification, all those files are
# skipped, and only the main license gets reported.

[moxcms.clarify]
license = "BSD-3-Clause OR Apache-2.0"

[[moxcms.clarify.files]]
path = "LICENSE.md"
checksum = "2aa92cada6431e75615e3fe6cb1a9082c98f777d48ae1c087c0da0e37f7b8bff"

[pxfm.clarify]
license = "BSD-3-Clause OR Apache-2.0"

[[pxfm.clarify.files]]
path = "LICENSE.md"
checksum = "2aa92cada6431e75615e3fe6cb1a9082c98f777d48ae1c087c0da0e37f7b8bff"
